# Upptime configuration — https://upptime.js.org/docs/configuration
#
# This file is the single source of truth for the status page. The workflows in
# .github/workflows are GENERATED from it by Upptime's `update-template` command
# (Setup CI reruns it on every push that touches this file); edit this file, not
# the workflows.
owner: experientiallabs
repo: status
user-agent: experientiallabs

sites:
  # /signin is a light (~21 KB), stable, always-public app-rendered page: it
  # proves the web pod serves without the cost of the root's 307 redirect into
  # the ~2 MB /models catalog, which inflated the average response time to
  # ~575 ms for what the page presents as "is the dashboard up".
  - name: Web Dashboard
    slug: web
    url: https://platform.experientiallabs.ai/signin
    expectedStatusCodes: [200]
  # Unauthenticated /v1/models must be REJECTED BY THE APP: a 401 proves the
  # edge, gateway worker, and auth path are alive end to end. A 5xx (like the
  # 502s when the session pooler saturates) is down. Do not "fix" this to 200.
  - name: API
    slug: api
    url: https://api.experientiallabs.ai/v1/models
    expectedStatusCodes: [401]
  - name: Docs
    slug: docs
    url: https://platform.experientiallabs.ai/docs
    expectedStatusCodes: [200]
  # Deep gateway probe: a real completion through the serving path, funded by a
  # dedicated status-org key. Disabled until that key exists as the
  # STATUS_GATEWAY_API_KEY repository secret (see README "Enabling the gateway
  # probe"); with the site enabled but the secret missing, the literal string
  # would be sent as the bearer token and the check would report a false DOWN.
  # - name: Gateway Completions
  #   slug: gateway
  #   url: https://api.experientiallabs.ai/v1/chat/completions
  #   method: POST
  #   headers:
  #     - "Authorization: Bearer $STATUS_GATEWAY_API_KEY"
  #     - "Content-Type: application/json"
  #   body: '{"model": "qwen3.8-27b", "messages": [{"role": "user", "content": "ping"}], "max_tokens": 1}'
  #   expectedStatusCodes: [200]

# Authoritative allowlist of repository secrets exposed to the checker; without
# this, Upptime injects its full notification-secret compatibility list.
secrets:
  - STATUS_GATEWAY_API_KEY

# Down/degraded incidents are opened as GitHub Issues and auto-assigned here.
assignees:
  - SilenNaihin

# Partial overrides merge with the generator's i18n defaults.
i18n:
  liveStatus: Components

# Repo metadata (description, topics, homepage) stays human-managed; letting the
# bot write it needs a PAT with admin scope we'd rather not grant.
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

status-website:
  cname: status.experientiallabs.ai
  name: Experiential Labs Status
  # Statuspage-style restyle (status.claude.com look): light-only theme with a
  # CSS override sheet injected after the theme stylesheet. The generator's DOM
  # is untouched — the summary banner text nodes are collapsed (font-size: 0)
  # and repainted via ::before, status pills are ::after content keyed off the
  # generator's up/down/degraded classes, and the sparkline card backgrounds
  # are hidden. Statuspage's per-day 90-day uptime bars are NOT reproducible:
  # Upptime publishes only aggregate uptime percentages (day/week/month/year),
  # not per-day series, so that element has no data source without a custom
  # generator.
  theme: light
  css: |
    :root {
      --body-background-color: #ffffff;
      --body-text-color: #1f2937;
      --card-background-color: #ffffff;
      --card-border-color: #e5e7eb;
      --nav-background-color: #ffffff;
      --nav-border-bottom-color: #e5e7eb;
      --nav-current-border-bottom-color: #2fcc66;
      --up-border-left-color: #2fcc66;
      --down-border-left-color: #e74c3c;
      --degraded-border-left-color: #f1c40f;
      --change-background-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    }
    .container { max-width: 880px; }
    main > header h1 { font-size: 1.35rem; font-weight: 600; }
    main > header h1 strong { font-weight: 700; }
    main > header p.lead { color: #6b7280; font-size: 0.875rem; }
    /* Summary banner: collapse the generator's emoji + text, paint our own. */
    main > article.up {
      background: #2fcc66;
      border: none;
      border-left: none !important;
      border-radius: 6px;
      padding: 1.05rem 1.25rem;
      font-size: 0;
    }
    main > article.up::before {
      content: "All Systems Operational";
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
    }
    /* Live Status heading and period selector, quiet. */
    main > .f > h2 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b7280;
    }
    main > .f form label { color: #9ca3af; font-size: 0.8rem; cursor: pointer; }
    main > .f form input:checked + label { color: #1f2937; }
    /* Component rows: white bordered cards, no sparkline hero, status pill. */
    section.live-status article.graph {
      background-image: none !important;
      border-left-width: 1px !important;
      border-radius: 6px;
      padding: 0.95rem 1.15rem;
    }
    section.live-status .icon { display: none; }
    section.live-status article h4 {
      display: inline-block;
      font-size: 0.95rem;
      margin: 0 0 0.3rem 0;
    }
    section.live-status article::after {
      position: absolute;
      right: 1.15rem;
      top: 1rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    section.live-status article.up::after { content: "Operational"; color: #2fcc66; }
    section.live-status article.down::after { content: "Down"; color: #e74c3c; }
    section.live-status article.degraded::after { content: "Degraded"; color: #b7791f; }
    section.live-status article > div {
      display: inline-block;
      margin-right: 1.25rem;
      font-size: 0.8rem;
      color: #6b7280;
    }
    section.live-status article .data {
      background: none !important;
      padding: 0;
      color: #374151;
      font-variant-numeric: tabular-nums;
    }
    /* Past incidents: calm date headers, white cards with a colored accent. */
    main section h2 { font-size: 1rem; font-weight: 600; }
    main section h3 {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 1;
      color: #1f2937;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.4rem;
    }
    footer { font-size: 0.8rem; color: #9ca3af; }
    footer a { color: #6b7280; }
  # Served from this repo, not from the platform, so the logo still loads while
  # the platform is down.
  logoUrl: https://raw.githubusercontent.com/experientiallabs/status/HEAD/assets/logo.svg
  introTitle: "**Experiential Labs** system status"
  introMessage: Live uptime and incident history for the Experiential Labs model gateway, checked every 5 minutes from GitHub Actions — independent of our own infrastructure.
  navbar:
    - title: Status
      href: /
    - title: Platform
      href: https://platform.experientiallabs.ai
    - title: Docs
      href: https://platform.experientiallabs.ai/docs
    - title: GitHub
      href: https://github.com/experientiallabs/status
