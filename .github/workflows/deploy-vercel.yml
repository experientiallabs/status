# Hand-maintained (NOT generated by Upptime; update-template leaves it alone).
#
# Serving lives on Vercel because GitHub Pages' certificate issuance for
# status.experientiallabs.ai was terminally stuck in bad_authz. The gh-pages
# branch stays the build artifact: Static Site CI exports the site there, and
# this workflow ships that exact tree to the Vercel project "status".
name: Deploy to Vercel
on:
  # Setup CI deploys gh-pages itself on config pushes; Static Site CI covers
  # the daily rebuild and asset pushes. Both must reach Vercel.
  workflow_run:
    workflows: ["Static Site CI", "Setup CI"]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-deploy-vercel
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy gh-pages to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
      - name: Checkout main assets
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src
      # The status-ui enhancements (90-day uptime bars, dated Past Incidents)
      # are plain files on main, referenced from customHeadHtml as /ui/*; the
      # generated site tree does not carry them, so overlay them at deploy time.
      - name: Overlay status-ui assets
        run: |
          mkdir -p ui
          cp main-src/assets/status-ui/* ui/
          rm -rf main-src
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"prj_6KuHcCVoCcSDWdJyYwVmNt8gdmBz"}' "$VERCEL_ORG_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      - name: Deploy
        run: npx -y vercel@59.5.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
