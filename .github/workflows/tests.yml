# Hand-maintained (NOT generated by Upptime; update-template leaves it alone).
# Unit tests for the hand-written Node code: the Atom feed builder and the
# Slack fan-out / OAuth helpers behind the Vercel functions. Zero dependencies
# (node:test).
name: Tests
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "vercel/**"
      - "assets/status-ui/uptime-bars.js"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "vercel/**"
      - "assets/status-ui/uptime-bars.js"
permissions:
  contents: read
jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test 'tests/*.test.mjs'
      - name: Feed builder runs on the committed record
        run: node scripts/build-feed.mjs --out /tmp/feed.xml && head -c 400 /tmp/feed.xml
