# Hand-maintained (NOT generated by Upptime; update-template leaves it alone).
#
# @mentions the owner in Slack when a public component goes DOWN.
#
# Upptime's own Slack notifications (NOTIFICATION_SLACK=true) post plain text
# and cannot mention anyone, and without the webhook secret an incident was
# only ever a GitHub issue assigned to the owner. This workflow listens to the
# incident issues the checker opens and closes and posts to the same webhook:
#
#   opened/reopened, title "🟥 <name> is down" (or 🛑)   -> post WITH <@owner>
#   opened/reopened, title "⚠️ <name> has degraded ..."   -> post, no mention
#   closed                                                -> recovery, no mention
#
# Only the three public rows (labels web, api, docs) qualify; `gateway` (the
# authenticated probe) and `traffic-alert` issues (traffic-health.yml posts
# its own) are ignored. With NOTIFICATION_SLACK_WEBHOOK_URL unset this logs
# "webhook not configured" and exits 0.
#
# Test without an incident: Actions -> Slack Mention -> Run workflow. With
# dry_run=true (default) the payload is printed instead of posted; with
# dry_run=false the synthetic message is posted for real.
name: Slack Mention
on:
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the payload instead of posting it"
        type: boolean
        default: true
      component:
        description: "Component to simulate"
        type: choice
        options: [api, web, docs]
        default: api
      state:
        description: "Incident state to simulate"
        type: choice
        options: [down, degraded]
        default: down
      action:
        description: "Issue event to simulate"
        type: choice
        options: [opened, closed]
        default: opened
permissions:
  contents: read
env:
  OWNER_SLACK_ID: U0B6Y9K9C00
  STATUS_URL: https://status.experientiallabs.ai
jobs:
  notify:
    name: Post to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Real issue events must carry `status` plus one of the public rows; the
    # manual test path always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.issue.labels.*.name, 'status') &&
        (
          contains(github.event.issue.labels.*.name, 'web') ||
          contains(github.event.issue.labels.*.name, 'api') ||
          contains(github.event.issue.labels.*.name, 'docs')
        )
      )
    steps:
      - name: Build and send the message
        env:
          SLACK_WEBHOOK: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          # Issue event fields (empty on workflow_dispatch).
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
          ISSUE_CLOSED: ${{ github.event.issue.closed_at }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          # Manual test inputs.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SIM_COMPONENT: ${{ inputs.component }}
          SIM_STATE: ${{ inputs.state }}
          SIM_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import datetime, json, os, re, sys

          env = os.environ
          owner = env["OWNER_SLACK_ID"]
          status_url = env["STATUS_URL"]
          names = {"web": "Web Dashboard", "api": "API", "docs": "Docs"}

          if env["EVENT_NAME"] == "workflow_dispatch":
              component = env["SIM_COMPONENT"]
              name = names[component]
              state = env["SIM_STATE"]
              action = env["SIM_ACTION"]
              title = f"🟥 {name} is down" if state == "down" else f"⚠️ {name} has degraded performance"
              url = "https://github.com/experientiallabs/status/issues/0 (simulated)"
              created = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(minutes=23)
              closed = datetime.datetime.now(datetime.timezone.utc)
          else:
              action = env["ISSUE_ACTION"]
              title = env["ISSUE_TITLE"]
              url = env["ISSUE_URL"]
              labels = env["ISSUE_LABELS"].split(",")
              component = next((c for c in ("web", "api", "docs") if c in labels), None)
              # Upptime titles: "🟥 <name> is down" (🛑 on newer versions) / "⚠️ <name> has degraded performance".
              if " is down" in title:
                  state = "down"
              elif "degraded performance" in title:
                  state = "degraded"
              else:
                  print(f"skip: title {title!r} is neither a down nor a degraded incident", file=sys.stderr)
                  raise SystemExit(0)
              m = re.match(r"^\S*\s*(.+?) (is down|has degraded performance)\s*$", title)
              name = m.group(1) if m else names.get(component, component or "component")
              parse = lambda v: datetime.datetime.fromisoformat(v.replace("Z", "+00:00"))
              created = parse(env["ISSUE_CREATED"])
              closed = parse(env["ISSUE_CLOSED"]) if env.get("ISSUE_CLOSED") else datetime.datetime.now(datetime.timezone.utc)

          def duration(delta):
              minutes = max(1, int(round(delta.total_seconds() / 60)))
              hours, minutes = divmod(minutes, 60)
              return (f"{hours} h {minutes} min" if hours else f"{minutes} min")

          if action in ("opened", "reopened"):
              if state == "down":
                  text = f"<@{owner}> :red_circle: *{name} is down* — {status_url} — {url}"
              else:
                  text = f":large_yellow_circle: *{name} has degraded performance* — {status_url} — {url}"
          elif action == "closed":
              took = duration(closed - created)
              if state == "down":
                  text = f":large_green_circle: {name} is back up after {took} — {url}"
              else:
                  text = f":large_green_circle: {name} performance recovered after {took} — {url}"
          else:
              print(f"skip: action {action!r} not handled", file=sys.stderr)
              raise SystemExit(0)
          print(json.dumps({"text": text}))
          PY
          )
          if [ -z "$payload" ]; then
            echo "Nothing to post."
            exit 0
          fi
          echo "payload: $payload"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run: not posting."
            exit 0
          fi
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "webhook not configured (NOTIFICATION_SLACK_WEBHOOK_URL is empty); nothing sent."
            exit 0
          fi
          code=$(curl -sS -o /tmp/slack.out -w '%{http_code}' -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK")
          echo "slack: HTTP $code $(cat /tmp/slack.out)"
          [ "$code" = "200" ]
