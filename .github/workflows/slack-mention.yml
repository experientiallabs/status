# Hand-maintained (NOT generated by Upptime; update-template leaves it alone).
#
# Turns the checker's incident issues into Slack messages.
#
#   opened/reopened, title "🟥 <name> is down" (or 🛑)   -> internal channel WITH <@owner>
#   opened/reopened, title "⚠️ <name> has degraded ..."   -> internal channel, no mention
#   closed                                                -> recovery line with the duration
#
# The three public rows (labels web, api, docs) and the signed-in dashboard
# check (label dashboard, opened by signed-in-health.yml with the same title
# shape) qualify; `gateway` (the authenticated probe) and `traffic-alert`
# issues (traffic-health.yml posts its own) are ignored. The wording lives in ONE place,
# vercel/api/_lib/message.mjs, used by both delivery paths:
#
#   1. NOTIFY_TOKEN set (repo secret): POST the event to
#      https://status.experientiallabs.ai/api/notify, which posts the internal
#      channel (mention) AND every self-service Slack subscriber (no mention).
#   2. Otherwise: post the internal channel directly from the runner using
#      NOTIFICATION_SLACK_WEBHOOK_URL. With neither configured this logs
#      "webhook not configured" and exits 0.
#
# Test without an incident: Actions -> Slack Mention -> Run workflow. With
# dry_run=true (default) the payload is printed instead of posted; with
# dry_run=false the synthetic message is posted for real (and, via
# /api/notify, reaches subscribers, so use a closed/degraded event for that).
name: Slack Mention
on:
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the payload instead of posting it"
        type: boolean
        default: true
      component:
        description: "Component to simulate"
        type: choice
        options: [api, web, docs, dashboard]
        default: api
      state:
        description: "Incident state to simulate"
        type: choice
        options: [down, degraded]
        default: down
      action:
        description: "Issue event to simulate"
        type: choice
        options: [opened, closed]
        default: opened
permissions:
  contents: read
env:
  NOTIFY_URL: https://status.experientiallabs.ai/api/notify
jobs:
  notify:
    name: Post to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Real issue events must carry `status` plus one of the public rows; the
    # manual test path always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.issue.labels.*.name, 'status') &&
        (
          contains(github.event.issue.labels.*.name, 'web') ||
          contains(github.event.issue.labels.*.name, 'api') ||
          contains(github.event.issue.labels.*.name, 'docs') ||
          contains(github.event.issue.labels.*.name, 'dashboard')
        )
      )
    steps:
      - name: Checkout (for the shared message module)
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build the incident event
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Issue event fields (empty on workflow_dispatch).
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
          ISSUE_CLOSED: ${{ github.event.issue.closed_at }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          # Manual test inputs.
          SIM_COMPONENT: ${{ inputs.component }}
          SIM_STATE: ${{ inputs.state }}
          SIM_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import { writeFileSync, appendFileSync } from "node:fs";
          import { formatDuration } from "./vercel/api/_lib/message.mjs";
          const env = process.env;
          let event;
          if (env.EVENT_NAME === "workflow_dispatch") {
            const now = Date.now();
            event = {
              event: env.SIM_ACTION,
              component: env.SIM_COMPONENT,
              state: env.SIM_STATE,
              title: "simulated",
              url: "https://github.com/experientiallabs/status/issues/0",
              duration: env.SIM_ACTION === "closed" ? formatDuration(now - 23 * 60000, now) : "",
            };
          } else {
            const title = env.ISSUE_TITLE || "";
            // Upptime titles: "🟥 <name> is down" (🛑 on newer versions) /
            // "⚠️ <name> has degraded performance".
            const state = / is down/.test(title) ? "down" : /degraded performance/i.test(title) ? "degraded" : null;
            if (!state) {
              console.error(`skip: title ${JSON.stringify(title)} is neither a down nor a degraded incident`);
              appendFileSync(env.GITHUB_OUTPUT, "skip=true\n");
              process.exit(0);
            }
            const labels = (env.ISSUE_LABELS || "").split(",");
            const component = ["web", "api", "docs", "dashboard"].find((c) => labels.includes(c)) || "api";
            const action = env.ISSUE_ACTION === "reopened" ? "opened" : env.ISSUE_ACTION;
            event = {
              event: action,
              component,
              state,
              title: title.replace(/^\S*\s*/, ""),
              url: env.ISSUE_URL,
              duration: action === "closed" && env.ISSUE_CREATED ? formatDuration(env.ISSUE_CREATED, env.ISSUE_CLOSED || Date.now()) : "",
            };
          }
          writeFileSync("/tmp/event.json", JSON.stringify(event));
          console.log(`event: ${JSON.stringify(event)}`);
          appendFileSync(env.GITHUB_OUTPUT, "skip=false\n");
          JS
      - name: Deliver
        if: steps.event.outputs.skip == 'false'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -n "${NOTIFY_TOKEN:-}" ] && echo "::add-mask::$NOTIFY_TOKEN"
          payload=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { slackPayload } from "./vercel/api/_lib/message.mjs";
            console.log(JSON.stringify(slackPayload(JSON.parse(readFileSync("/tmp/event.json", "utf8")), { mention: true })));
          ')
          echo "internal payload: $payload"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run: not posting."
            exit 0
          fi
          if [ -n "${NOTIFY_TOKEN:-}" ]; then
            code=$(curl -sS -o /tmp/notify.out -w '%{http_code}' -X POST "$NOTIFY_URL" \
              -H "Authorization: Bearer $NOTIFY_TOKEN" -H 'Content-Type: application/json' \
              --data @/tmp/event.json)
            echo "/api/notify: HTTP $code $(cat /tmp/notify.out)"
            [ "$code" = "200" ] && exit 0
            echo "::warning::/api/notify returned HTTP $code; falling back to the internal webhook only."
          fi
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "webhook not configured (NOTIFICATION_SLACK_WEBHOOK_URL is empty); nothing sent."
            exit 0
          fi
          code=$(curl -sS -o /tmp/slack.out -w '%{http_code}' -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK")
          echo "slack: HTTP $code $(cat /tmp/slack.out)"
          [ "$code" = "200" ]
