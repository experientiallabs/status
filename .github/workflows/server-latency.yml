# Hand-maintained (NOT generated by Upptime; update-template leaves it alone).
#
# Refreshes assets/status-ui/server-latency.json from prod telemetry: the
# gateway's own routing overhead (p50 over 7 days), the honest server-side
# latency the page displays instead of the checker's cold-connection average.
# Uses the hard-capped read-only ops_agent role (connection limit 8, role-level
# timeouts); one short aggregate query per run.
name: Server Latency
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
# Same group as Upptime's generated workflows: this job pushes to main, and
# Upptime's checker pushes without rebasing (see traffic-health.yml). Never
# cancel-in-progress here: a cancel would hit whichever checker run holds the
# group.
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  refresh:
    name: Refresh server-side latency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Query prod telemetry
        env:
          DB_URL: ${{ secrets.PROD_OPS_AGENT_DB_URL }}
        run: |
          set -euo pipefail
          row=$(psql "$DB_URL" -tAc "
            select round(percentile_cont(0.5) within group (order by routing_overhead_ms)::numeric, 1),
                   count(*)
            from gateway_usage_events
            where created_at >= now() - interval '7 days'
              and routing_overhead_ms is not null")
          p50=$(echo "$row" | cut -d'|' -f1)
          n=$(echo "$row" | cut -d'|' -f2)
          if [ -z "$p50" ] || [ "$n" -eq 0 ]; then
            echo "No telemetry rows in window; keeping the previous file." >&2
            exit 0
          fi
          python3 - "$p50" "$n" <<'EOF'
          import json, sys, datetime
          p50, n = float(sys.argv[1]), int(sys.argv[2])
          path = "assets/status-ui/server-latency.json"
          data = json.load(open(path))
          data["generatedAt"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          data["components"]["api"].update({"p50Ms": p50, "sampleCount": n})
          open(path, "w").write(json.dumps(data, indent=2) + "\n")
          EOF
      - name: Commit if changed
        run: |
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git add assets/status-ui/server-latency.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m ":chart_with_upwards_trend: Refresh server-side latency [skip ci]"
          # Rebase over whatever the Upptime bots landed while this job ran
          # instead of failing the push (same loop as traffic-health.yml).
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash && continue
          done
          exit 1
